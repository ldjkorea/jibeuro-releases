<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>집으로 · 개발 중단 안내</title><style>body{margin:0;background:#f4f7f5;color:#183a30;font:17px/1.8 system-ui,sans-serif}main{max-width:640px;margin:auto;padding:64px 24px}h1{font-size:32px}p{margin:20px 0}.notice{background:white;border:1px solid #cad9cf;border-radius:20px;padding:24px}</style><main><h1>집으로 개발을 중단했습니다</h1><p>2026년 11월 2일부터 신규 개발과 배포를 중단하고 보관 상태로 전환했습니다.</p><div class="notice"><p>현재 이용할 귀가 경로는 네이버지도 또는 카카오맵 등에서 확인해 주세요.</p><p>마지막 배포본은 0.6.7입니다. 기존 설치 앱과 저장 데이터가 자동으로 삭제되지는 않습니다. 현재 운행 정보나 시간표의 최신성을 보장하지 않습니다.</p></div><p>재개 여부는 정해지지 않았습니다.</p></main></html>
